version: "3.9"
services:
  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: ["mongo-data:/data/db"]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  backend:
    build: ./backend
    ports: ["8080:8080"]
    environment:
      - MONGO_URI=mongodb://mongo:27017
      - MONGO_DB=pollingapp
      - REDIS_ADDR=redis:6379
      - JWT_SECRET=change-this-in-production
      - PORT=8080
      - ALLOW_ORIGIN=http://localhost:5173
    depends_on: [mongo, redis]

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8080
    ports: ["5173:80"]
    depends_on: [backend]

volumes:
  mongo-data:
